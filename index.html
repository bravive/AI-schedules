<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Schedules — Daily Briefing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/css/style.css">
  <style>
    body { overflow: hidden; }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar__header {
      padding: var(--space-5) var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }

    .sidebar__logo {
      font-size: var(--text-lg);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-text);
    }

    .sidebar__tagline {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .sidebar__tasks {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3) 0;
    }

    .sidebar__task-group {
      margin-bottom: var(--space-2);
    }

    .sidebar__task-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      user-select: none;
    }

    .sidebar__task-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .sidebar__task-icon--ai {
      background: var(--color-accent-dim);
      color: var(--color-accent);
    }

    .sidebar__task-icon--stock {
      background: var(--color-success-dim);
      color: var(--color-success);
    }

    .sidebar__entries {
      list-style: none;
    }

    .sidebar__entry {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4) var(--space-2) var(--space-8);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border-left: 2px solid transparent;
    }

    .sidebar__entry:hover {
      background: var(--color-surface-hover);
      color: var(--color-text);
    }

    .sidebar__entry--active {
      background: var(--color-accent-dim);
      color: var(--color-accent);
      border-left-color: var(--color-accent);
    }

    .sidebar__entry-date {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .sidebar__entry--active .sidebar__entry-date {
      color: var(--color-accent);
    }

    .sidebar__entry-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Main Content ---- */
    .main {
      flex: 1;
      overflow: hidden;
      background: var(--color-bg);
    }

    .content-frame {
      border: none;
      width: 100%;
      height: 100%;
    }

    /* ---- Mobile sidebar toggle ---- */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: var(--space-3);
      left: var(--space-3);
      z-index: 100;
      width: 40px;
      height: 40px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-text);
      font-size: 1.2rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .mobile-toggle { display: flex; }
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 99;
        transition: left 0.25s ease;
        box-shadow: var(--shadow-lg);
      }
      .sidebar--open { left: 0; }
    }

    /* ---- Sidebar footer ---- */
    .sidebar__footer {
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--color-border);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('sidebar--open')">&#9776;</button>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <div class="sidebar__logo">AI Schedules</div>
        <div class="sidebar__tagline">Daily briefings by AI agents</div>
      </div>

      <nav class="sidebar__tasks" id="sidebar-nav">

        <!-- AI Learning Engineer -->
        <div class="sidebar__task-group">
          <div class="sidebar__task-label">
            <div class="sidebar__task-icon sidebar__task-icon--ai">&#9883;</div>
            AI Learning Engineer
          </div>
          <ul class="sidebar__entries" id="entries-ai-learning-engineer">
            <li class="sidebar__entry sidebar__entry--active"
                data-task="ai-learning-engineer" data-date="2026-03-11"
                onclick="loadEntry(this)">
              <span class="sidebar__entry-date">03-11</span>
              <span class="sidebar__entry-name">2026-03-11</span>
            </li>
          </ul>
        </div>

        <!-- Stock Trader -->
        <div class="sidebar__task-group">
          <div class="sidebar__task-label">
            <div class="sidebar__task-icon sidebar__task-icon--stock">&#9650;</div>
            Stock Trader
          </div>
          <ul class="sidebar__entries" id="entries-stock-trader">
            <li class="sidebar__entry"
                data-task="stock-trader" data-date="2026-03-11"
                onclick="loadEntry(this)">
              <span class="sidebar__entry-date">03-11</span>
              <span class="sidebar__entry-name">2026-03-11</span>
            </li>
          </ul>
        </div>

      </nav>

      <div class="sidebar__footer">
        Automated with GitHub Actions
      </div>
    </aside>

    <!-- Main reading area -->
    <main class="main">
      <iframe id="content-frame" class="content-frame"
              src="output/ai-learning-engineer/2026-03-11.html"
              title="Task content"></iframe>
    </main>

  </div>

  <script>
    function loadEntry(el) {
      document.querySelectorAll('.sidebar__entry').forEach(e => e.classList.remove('sidebar__entry--active'));
      el.classList.add('sidebar__entry--active');

      const task = el.dataset.task;
      const date = el.dataset.date;
      document.getElementById('content-frame').src = 'output/' + task + '/' + date + '.html';

      document.querySelector('.sidebar').classList.remove('sidebar--open');
    }

    // Load manifest to populate sidebar entries dynamically
    fetch('output/manifest.json')
      .then(function(r) { return r.json(); })
      .then(function(manifest) {
        if (!manifest.archive || manifest.archive.length === 0) return;

        var aiEntries = document.getElementById('entries-ai-learning-engineer');
        var stockEntries = document.getElementById('entries-stock-trader');
        aiEntries.innerHTML = '';
        stockEntries.innerHTML = '';

        var taskEntries = { 'ai-learning-engineer': [], 'stock-trader': [] };

        manifest.archive.forEach(function(entry) {
          entry.tasks.forEach(function(t) {
            if (taskEntries[t.type]) {
              taskEntries[t.type].push({ date: entry.date, path: t.path });
            }
          });
        });

        var firstLoaded = false;

        Object.keys(taskEntries).forEach(function(taskType) {
          var container = taskType === 'ai-learning-engineer' ? aiEntries : stockEntries;
          var entries = taskEntries[taskType];

          entries.forEach(function(e, i) {
            var li = document.createElement('li');
            li.className = 'sidebar__entry' + (!firstLoaded && i === 0 ? ' sidebar__entry--active' : '');
            li.dataset.task = taskType;
            li.dataset.date = e.date;
            li.onclick = function() { loadEntry(li); };

            var shortDate = e.date.substring(5);
            li.innerHTML = '<span class="sidebar__entry-date">' + shortDate + '</span>' +
              '<span class="sidebar__entry-name">' + e.date + '</span>';
            container.appendChild(li);

            if (!firstLoaded && i === 0) {
              document.getElementById('content-frame').src = e.path;
              firstLoaded = true;
            }
          });
        });
      })
      .catch(function() {
        // No manifest yet — keep static entries
      });
  </script>
</body>
</html>
